<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Little Universe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at center, #252052 0%, #110d2b 45%, #050510 100%);

            position: relative;
        }


        /* =========================
           ESTRELLAS PEQUEÑAS DEL FONDO
           ========================= */

        .fondo {
            position: absolute;
            width: 100%;
            height: 100%;

            pointer-events: none;
        }

        .fondo span {
            position: absolute;

            color: white;

            font-size: 12px;

            opacity: 0.7;

            animation: brillo 3s infinite alternate;
        }

        .fondo span:nth-child(1) {
            top: 8%;
            left: 12%;
        }

        .fondo span:nth-child(2) {
            top: 15%;
            left: 45%;
        }

        .fondo span:nth-child(3) {
            top: 12%;
            left: 85%;
        }

        .fondo span:nth-child(4) {
            top: 35%;
            left: 8%;
        }

        .fondo span:nth-child(5) {
            top: 40%;
            left: 90%;
        }

        .fondo span:nth-child(6) {
            top: 75%;
            left: 12%;
        }

        .fondo span:nth-child(7) {
            top: 85%;
            left: 40%;
        }

        .fondo span:nth-child(8) {
            top: 75%;
            left: 85%;
        }

        .fondo span:nth-child(9) {
            top: 55%;
            left: 50%;
        }

        .fondo span:nth-child(10) {
            top: 25%;
            left: 65%;
        }


        @keyframes brillo {

            from {
                opacity: 0.3;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1.3);
            }

        }


        /* =========================
           TITULO
           ========================= */

        .titulo {

            position: absolute;

            top: 35px;

            width: 100%;

            text-align: center;

            color: white;

            font-size: 30px;

            letter-spacing: 3px;

            text-shadow:
                0 0 10px rgba(255,255,255,0.5);
        }


        /* =========================
           LUNA
           ========================= */

        .luna {

            position: absolute;

            width: 190px;
            height: 190px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: #fff4c4;

            cursor: pointer;

            box-shadow:
                0 0 20px #fff4c4,
                0 0 50px rgba(255,244,196,0.7),
                0 0 100px rgba(255,244,196,0.3);

            transition: 0.4s;
        }


        .luna:hover {

            transform: translate(-50%, -50%) scale(1.08);

            box-shadow:
                0 0 30px #fff4c4,
                0 0 70px rgba(255,244,196,0.9),
                0 0 130px rgba(255,244,196,0.5);
        }


        /* =========================
           CRÁTERES DE LA LUNA
           ========================= */

        .crater {

            position: absolute;

            border-radius: 50%;

            background: rgba(190,175,130,0.28);
        }

        .c1 {

            width: 40px;
            height: 40px;

            top: 30px;
            left: 35px;
        }

        .c2 {

            width: 27px;
            height: 27px;

            top: 90px;
            left: 105px;
        }

        .c3 {

            width: 20px;
            height: 20px;

            top: 120px;
            left: 60px;
        }

        .c4 {

            width: 15px;
            height: 15px;

            top: 55px;
            left: 115px;
        }


        /* =========================
           ESTRELLAS GRANDES
           ========================= */

        .estrella {

            position: absolute;

            color: white;

            font-size: 60px;

            cursor: pointer;

            transition: 0.3s;

            text-shadow:
                0 0 10px white,
                0 0 25px #aaaaff,
                0 0 45px rgba(180,180,255,0.7);

            animation: estrellaBrilla 2.5s infinite alternate;
        }


        .estrella:hover {

            transform: scale(1.3);

            text-shadow:
                0 0 15px white,
                0 0 35px white,
                0 0 60px #aaaaff;
        }


        @keyframes estrellaBrilla {

            from {
                opacity: 0.65;
            }

            to {
                opacity: 1;
            }

        }


        /* =========================
           POSICIÓN DE LAS 3 ESTRELLAS
           ========================= */

        #estrella1 {

            top: 25%;

            left: 22%;
        }


        #estrella2 {

            bottom: 20%;

            left: 25%;
        }


        #estrella3 {

            top: 28%;

            right: 20%;
        }


        /* =========================
           TEXTO DE AYUDA
           ========================= */

        .instruccion {

            position: absolute;

            bottom: 30px;

            width: 100%;

            text-align: center;

            color: rgba(255,255,255,0.65);

            font-size: 15px;

            letter-spacing: 1px;
        }

    </style>

</head>


<body>


    <!-- =========================
         ESTRELLAS DEL FONDO
         ========================= -->

    <div class="fondo">

        <span>✦</span>
        <span>✧</span>
        <span>·</span>
        <span>✦</span>
        <span>·</span>
        <span>✧</span>
        <span>✦</span>
        <span>·</span>
        <span>✧</span>
        <span>✦</span>

    </div>


    <!-- =========================
         TITULO
         ========================= -->

    <div class="titulo">

        Our Little Universe

    </div>


    <!-- =========================
         ESTRELLA 1
         ========================= -->

    <div
        class="estrella"
        id="estrella1"
        onclick="window.location.href='estrella1.html'">

        ★

    </div>


    <!-- =========================
         ESTRELLA 2
         ========================= -->

    <div
        class="estrella"
        id="estrella2"
        onclick="window.location.href='estrella2.html'">

        ★

    </div>


    <!-- =========================
         ESTRELLA 3
         ========================= -->

    <div
        class="estrella"
        id="estrella3"
        onclick="window.location.href='estrella3.html'">

        ★

    </div>


    <!-- =========================
         LUNA
         ========================= -->

    <div
        class="luna"
        onclick="window.location.href='luna.html'">

        <div class="crater c1"></div>

        <div class="crater c2"></div>

        <div class="crater c3"></div>

        <div class="crater c4"></div>

    </div>


    <!-- =========================
         INSTRUCCIÓN
         ========================= -->

    <div class="instruccion">

        click the stars and the moon...

    </div>


</body>
</html>
